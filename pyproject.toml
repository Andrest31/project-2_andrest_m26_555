[project]
name = "project-2-andrest-m26-555"
version = "0.1.0"
description = "Primitive database CLI application"
authors = [
    {name = "Владислав", email = "128243532+Andrest31@users.noreply.github.com"}
]
requires-python = ">=3.14"
dependencies = ["prompt (>=0.4.1,<0.5.0)", "prettytable (>=3.18.0,<4.0.0)"]

[project.scripts]
database = "src.primitive_db.main:main"

[tool.poetry]
packages = [
    { include = "src" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "ruff (>=0.16.9,<0.17.0)"
]

[tool.ruff]
line-length = 88
target-version = "py314"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []